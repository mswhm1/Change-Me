<script>
// تهيئة السمة فوراً لمنع وميض الصفحة
function initTheme() {
  const uaMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(navigator.userAgent || '');
  const isTouch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  const shortSide = Math.min(screen.width || innerWidth, screen.height || innerHeight);
  if (innerWidth <= 980 || uaMobile || (isTouch && shortSide <= 900)) {
    document.documentElement.classList.add('mobile-mode');
    document.documentElement.setAttribute('data-initial-mobile', 'true');
  }
  if (window.initializeTheme) {
    window.initializeTheme();
  } else {
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  }
}
initTheme();
</script>
